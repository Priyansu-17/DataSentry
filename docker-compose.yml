version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: datasentry_postgres
    environment:
      POSTGRES_DB: datasentry
      POSTGRES_USER: datasentry_user
      POSTGRES_PASSWORD: datasentry_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasentry_user -d datasentry"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
